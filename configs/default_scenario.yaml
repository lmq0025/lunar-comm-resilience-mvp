  - source: edge_compute
    target: relay_backup_1
    kind: local
    bandwidth_mbps: 30
    delay_ms: 18
    packet_loss_rate: 0.000004
    availability: 0.9991
  - source: science_station
    target: relay_backup_1
    kind: local
    bandwidth_mbps: 12
    delay_ms: 25
    packet_loss_rate: 0.000006
    availability: 0.9988
  - source: camera_station
    target: relay_backup_2
    kind: local
    bandwidth_mbps: 24
    delay_ms: 28
    packet_loss_rate: 0.000008
    availability: 0.9985

services:
  - id: control_command
    source: ground_station
    target: rover_1
    priority: 1
    required_bandwidth_mbps: 1
    max_delay_ms: 1450
    max_loss_rate: 0.00001
  - id: science_data
    source: science_station
    target: ground_station
    priority: 3
    required_bandwidth_mbps: 8
    max_delay_ms: 1800
    max_interruption_s: 1
  - id: hd_video
    source: camera_station
    target: ground_station
    priority: 4
    required_bandwidth_mbps: 30
    degraded_bandwidth_mbps: 12
    max_delay_ms: 1850
    min_success_rate: 0.999
  - id: teleoperation
    source: teleop_terminal
    target: rover_2
    priority: 2
    required_bandwidth_mbps: 4
    max_delay_ms: 160
    max_loss_rate: 0.00002

faults:
  enabled:
    - main_hub_failure
    - dust_antenna_degradation
    - relay_handover_delay
    - buffer_overflow
  schedule:
    - id: F6
      type: main_hub_failure
      start_s: 30
      duration_s: 25
      target: lander_main_hub
      severity: 0.95
    - id: F3
      type: dust_antenna_degradation
      start_s: 10
      duration_s: 90
      target: all_rf_links
      severity: 0.35
    - id: F7
      type: relay_handover_delay
      start_s: 45
      duration_s: 5
      target: lunar_orbiter
      severity: 0.60
    - id: F8
      type: buffer_overflow
      start_s: 62
      duration_s: 12
      target: edge_compute
      severity: 0.50

healing:
  enabled:
    - reroute_backup_path
    - priority_scheduling
    - service_degradation
    - store_and_forward
    - relay_pre_handover
