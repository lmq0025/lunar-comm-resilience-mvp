scenario:
  name: default_lunar_comm_resilience_mvp
  duration_s: 120
  random_seed: 42

environment:
  dust_level: 0.35
  temperature_c: -45
  radiation_level: 0.30
  obstruction_probability: 0.08
  obstruction_duration_s: 8
  relay_handover:
    handover_start_s: 45
    handover_duration_s: 5
    handover_extra_delay_ms: 120

model_parameters:
  k_dust_db: 3.0
  nominal_antenna_gain_db: 24.0
  nominal_snr_db: 21.0
  thermal_nominal_min_c: -80
  thermal_nominal_max_c: 60
  routing_convergence_ms: 35
  service_degradation_decision_ms: 120
  relay_pre_handover_disturbance_ms: 35
  priority_scheduling_response_ms: 80
  store_and_forward_response_ms: 420
  reference_rf_lifetime_prediction_error_pct: 8.0
  reference_dust_gain_error_pct: 4.0
  reference_cascading_fault_prediction_accuracy: 0.92
  reference_fault_propagation_delay_error_pct: 12.0

physical_model_config:
  rf_lifetime:
    reference_path: data/baselines/rf_lifetime_reference.csv
    L0_h: 100000
    activation_scale: 180
    cold_scale: 1200
    radiation_scale: 0.7
    model_bias: 0.96
  dust_gain:
    reference_path: data/baselines/dust_gain_reference.csv
    linear_coeff: 2.6
    quadratic_coeff: 0.8
    model_bias: 0.97

technical_indicators:
  - id: rf_lifetime_prediction_error
    name: RF lifetime prediction error
    layer: physical
    operator: "<="
    threshold: 10.0
    unit: "%"
    metric: rf_lifetime_prediction_error_pct
    verification_method: MVP physical model compared with internal replaceable reference curve
    applicable_when:
      always: true
  - id: dust_gain_loss_error
    name: Lunar dust antenna gain loss quantification error
    layer: physical
    operator: "<="
    threshold: 5.0
    unit: "%"
    metric: dust_gain_loss_quantification_error_pct
    verification_method: MVP physical model compared with internal replaceable reference curve
    applicable_when:
      always: true
  - id: main_hub_subnet_paralysis
    name: Main-hub failure subnet paralysis probability
    layer: network
    operator: "<="
    threshold: 0.01
    unit: ratio
    metric: subnet_paralysis_probability
    verification_method: MVP topology and service reachability simulation
    applicable_when:
      fault_types_enabled:
        - main_hub_failure
  - id: relay_handover_disturbance
    name: Relay handover end-to-end delay disturbance
    layer: network
    operator: "<="
    threshold: 50.0
    unit: ms
    metric: relay_handover_delay_disturbance_ms
    verification_method: MVP handover fault and healing model
    applicable_when:
      fault_types_enabled:
        - relay_handover_delay
  - id: ka_channel_availability
    name: Ka-band channel availability
    layer: physical
    operator: ">="
    threshold: 0.995
    unit: ratio
    metric: ka_channel_availability
    verification_method: MVP link model
    applicable_when:
      always: true
  - id: route_convergence
    name: Route convergence time
    layer: network
    operator: "<="
    threshold: 50.0
    unit: ms
    metric: route_convergence_time_ms
    verification_method: reroute_backup_path healing action
    applicable_when:
      fault_types_enabled:
        - main_hub_failure
      healing_actions_required:
        - reroute_backup_path
  - id: urllc_command_loss
    name: URLLC command packet loss rate
    layer: service
    operator: "<="
    threshold: 0.00001
    unit: ratio
    metric: control_command_loss_rate
    verification_method: MVP service simulation
    applicable_when:
      always: true
  - id: hd_video_success
    name: HD video return success rate
    layer: service
    operator: ">="
    threshold: 0.999
    unit: ratio
    metric: video_return_success_rate
    verification_method: MVP service simulation with degradation policy
    applicable_when:
      always: true
  - id: fault_library_coverage
    name: Fault-mode library coverage
    layer: fault
    operator: ">="
    threshold: 8.0
    unit: count
    metric: fault_mode_library_coverage
    verification_method: coded fault library
    applicable_when:
      always: true
  - id: cascading_fault_prediction_accuracy
    name: Cascading fault prediction accuracy
    layer: fault
    operator: ">="
    threshold: 0.90
    unit: ratio
    metric: cascading_fault_prediction_accuracy
    verification_method: MVP fault propagation graph prediction compared with simulated observed impacts
    applicable_when:
      fault_propagation_enabled: true
  - id: fault_propagation_delay_error
    name: Fault propagation delay quantification error
    layer: fault
    operator: "<="
    threshold: 15.0
    unit: "%"
    metric: fault_propagation_delay_error_pct
    verification_method: MVP fault propagation graph prediction compared with simulated observed impacts
    applicable_when:
      fault_propagation_enabled: true
  - id: service_degradation_decision
    name: Service degradation decision time
    layer: service
    operator: "<="
    threshold: 200.0
    unit: ms
    metric: service_degradation_decision_ms
    verification_method: service_degradation healing action
    applicable_when:
      healing_actions_required:
        - service_degradation
  - id: resource_contention_resolution
    name: Resource contention resolution rate
    layer: service
    operator: ">="
    threshold: 0.95
    unit: ratio
    metric: resource_contention_resolution_rate
    verification_method: protected congested-service scheduling result
    applicable_when:
      fault_types_enabled:
        - buffer_overflow
  - id: science_data_interruption
    name: Science data return interruption
    layer: service
    operator: "<="
    threshold: 1.0
    unit: s
    metric: science_data_interruption_s
    verification_method: store-and-forward simulation
    applicable_when:
      fault_types_enabled:
        - main_hub_failure
      healing_actions_required:
        - store_and_forward

fault_propagation:
  enabled: true
  observation_model:
    route_validation_delay_ms: 12
    service_detection_delay_ms: 18
    physical_detection_delay_ms: 6
    congestion_detection_delay_ms: 14
    qos_detection_delay_ms: 24
  nodes:
    - id: main_hub_failure
      layer: fault
    - id: route_invalid
      layer: network
    - id: service_unreachable
      layer: service
    - id: dust_antenna_degradation
      layer: fault
    - id: snr_degradation
      layer: physical
    - id: packet_loss_increase
      layer: physical
    - id: relay_handover_delay
      layer: fault
    - id: end_to_end_delay_increase
      layer: network
    - id: buffer_overflow
      layer: fault
    - id: congestion_increase
      layer: network
    - id: service_qos_drop
      layer: service
    - id: science_data_interruption
      layer: service
    - id: video_return_failure
      layer: service
  edges:
    - source: main_hub_failure
      target: route_invalid
      probability: 0.98
      delay_ms: 10
    - source: route_invalid
      target: service_unreachable
      probability: 0.95
      delay_ms: 15
    - source: dust_antenna_degradation
      target: snr_degradation
      probability: 0.90
      delay_ms: 5
    - source: snr_degradation
      target: packet_loss_increase
      probability: 0.85
      delay_ms: 5
    - source: relay_handover_delay
      target: end_to_end_delay_increase
      probability: 0.95
      delay_ms: 20
    - source: buffer_overflow
      target: congestion_increase
      probability: 0.90
      delay_ms: 10
    - source: congestion_increase
      target: service_qos_drop
      probability: 0.80
      delay_ms: 20
    - source: service_unreachable
      target: science_data_interruption
      probability: 0.80
      delay_ms: 20
    - source: service_qos_drop
      target: video_return_failure
      probability: 0.75
      delay_ms: 25

nodes:
  - id: lander_main_hub
    type: main_hub
    role: primary_surface_gateway
  - id: relay_backup_1
    type: surface_relay
    role: backup_relay
  - id: relay_backup_2
    type: surface_relay
    role: backup_relay
  - id: rover_1
    type: rover
    role: mobile_user
  - id: rover_2
    type: rover
    role: mobile_user
  - id: rover_3
    type: rover
    role: mobile_user
  - id: edge_compute
    type: compute
    role: edge_cache_scheduler
  - id: science_station
    type: payload
    role: science_data_source
  - id: camera_station
    type: payload
    role: hd_video_source
  - id: teleop_terminal
    type: terminal
    role: teleoperation_terminal
  - id: lunar_orbiter
    type: orbiter
    role: lunar_relay_satellite
  - id: ground_station
    type: ground
    role: earth_ground_station

links:
  - source: rover_1
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 25
    delay_ms: 12
    packet_loss_rate: 0.000002
    availability: 0.9995
  - source: rover_1
    target: relay_backup_1
    kind: local
    bandwidth_mbps: 18
    delay_ms: 20
    packet_loss_rate: 0.000004
    availability: 0.9990
  - source: rover_2
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 25
    delay_ms: 14
    packet_loss_rate: 0.000002
    availability: 0.9995
  - source: rover_2
    target: relay_backup_2
    kind: local
    bandwidth_mbps: 18
    delay_ms: 21
    packet_loss_rate: 0.000004
    availability: 0.9990
  - source: rover_3
    target: relay_backup_1
    kind: local
    bandwidth_mbps: 18
    delay_ms: 18
    packet_loss_rate: 0.000004
    availability: 0.9992
  - source: science_station
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 16
    delay_ms: 20
    packet_loss_rate: 0.000004
    availability: 0.9992
  - source: camera_station
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 45
    delay_ms: 24
    packet_loss_rate: 0.000006
    availability: 0.9990
  - source: teleop_terminal
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 20
    delay_ms: 10
    packet_loss_rate: 0.000001
    availability: 0.9996
  - source: teleop_terminal
    target: relay_backup_2
    kind: local
    bandwidth_mbps: 12
    delay_ms: 18
    packet_loss_rate: 0.000004
    availability: 0.9990
  - source: edge_compute
    target: lander_main_hub
    kind: local
    bandwidth_mbps: 60
    delay_ms: 8
    packet_loss_rate: 0.000002
    availability: 0.9995
  - source: lander_main_hub
    target: relay_backup_1
    kind: redundant_surface
    bandwidth_mbps: 35
    delay_ms: 15
    packet_loss_rate: 0.000003
    availability: 0.9993
  - source: lander_main_hub
    target: relay_backup_2
    kind: redundant_surface
    bandwidth_mbps: 35
    delay_ms: 17
    packet_loss_rate: 0.000003
    availability: 0.9993
  - source: relay_backup_1
    target: relay_backup_2
    kind: redundant_surface
    bandwidth_mbps: 25
    delay_ms: 22
    packet_loss_rate: 0.000005
    availability: 0.9990
  - source: relay_backup_1
    target: lunar_orbiter
    kind: surface_to_orbit
    bandwidth_mbps: 20
    delay_ms: 85
    packet_loss_rate: 0.000010
    availability: 0.9985
  - source: relay_backup_2
    target: lunar_orbiter
    kind: surface_to_orbit
    bandwidth_mbps: 18
    delay_ms: 90
    packet_loss_rate: 0.000012
    availability: 0.9982
  - source: lander_main_hub
    target: lunar_orbiter
    kind: surface_to_orbit
    bandwidth_mbps: 40
    delay_ms: 70
    packet_loss_rate: 0.000006
    availability: 0.9990
  - source: lunar_orbiter
    target: ground_station
