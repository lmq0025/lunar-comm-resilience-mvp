experiment:
  name: healing_ablation
  type: ablation
  purpose: Compare self-healing strategy contribution.
strategy_sets:
  - name: no_healing
    healing_enabled: []
  - name: reroute_only
    healing_enabled:
      - reroute_backup_path
  - name: reroute_plus_priority
    healing_enabled:
      - reroute_backup_path
      - priority_scheduling
  - name: reroute_plus_priority_plus_degradation
    healing_enabled:
      - reroute_backup_path
      - priority_scheduling
      - service_degradation
  - name: full_healing
    healing_enabled:
      - reroute_backup_path
      - priority_scheduling
      - service_degradation
      - store_and_forward
      - relay_pre_handover
output_metrics:
  - indicator_pass_count
  - subnet_paralysis_probability
  - route_convergence_time_ms
  - control_command_loss_rate
  - video_return_success_rate
  - science_data_interruption_s
  - resource_contention_resolution_rate
